      tl.to("#dm-cursor", { opacity: 0, duration: 0.12 }, 1.68);

      const steps = ["#dm-st1", "#dm-st2", "#dm-st3"], nos = ["#dm-no1", "#dm-no2", "#dm-no3"], sgs = ["#dm-sg1", "#dm-sg2", "#dm-sg3"];
