  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const list = $("#mx-list"), viewH = 600;

      // The click on Mei AI opens this scene as a circle from the nav item.

      tl.set(["#mx-m1", "#mx-a1", "#mx-m2", "#mx-a2", "#mx-m3", "#mx-a3", "#mx-c1"], { opacity: 0 }, 0);
      tl.fromTo("#mx-hello", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.62);

      // "hours of manual work take seconds": the request is typed into the composer and sent.
      const q = "Generate the attendance report for last month with hours worked per person";
      const typed = $("#mx-typed"), o = { n: 0 };
      tl.fromTo(o, { n: 0 }, { n: q.length, duration: 1.45, ease: "none", onUpdate: () => { typed.textContent = q.slice(0, Math.round(o.n)); } }, 2.85);
      tl.set("#mx-ph", { opacity: 1 }, 0);
      tl.set("#mx-ph", { opacity: 0 }, 2.85);
      tl.fromTo("#mx-send", { scale: 1 }, { scale: 0.88, duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, 4.38);
      tl.call(() => { typed.textContent = ""; }, null, 4.46);
      tl.call(() => { typed.textContent = q.slice(0, Math.round(o.n)); }, null, 4.44);
      tl.set("#mx-ph", { opacity: 1 }, 4.46);
      tl.to("#mx-hello", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 4.4);
      enter("#mx-m1", 4.48);

      // Mei thinks, then the report builds row by row ("Ask for last month's attendance report").
      enter("#mx-a1", 4.62);
      tl.set("#mx-think", { opacity: 1 }, 0);
      gsap.utils.toArray("#mx-think i").forEach((d, i) => tl.fromTo(d, { opacity: 0.3 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 2, ease: "sine.inOut" }, 4.7 + i * 0.1));
      tl.set("#mx-think", { opacity: 0, height: 0, padding: 0 }, 5.4);
      tl.fromTo("#mx-c1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 5.42);
      tl.fromTo("#mx-c1 .rw", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out", stagger: 0.07 }, 5.65);
      scrollTo($("#mx-a1"), 5.7, 0.9);

      // "find your top clients"
      enter("#mx-m2", 7.95);
      scrollTo($("#mx-a2"), 8.0, 0.55);
      enter("#mx-a2", 8.45);
      tl.fromTo("#mx-a2 .tr i", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "expo.out", stagger: 0.1 }, 8.65);

      // "or have an invoice drafted"
      enter("#mx-m3", 9.5);
      scrollTo($("#mx-a3"), 9.55, 0.55);
      enter("#mx-a3", 10.05);

      // "Mei works from your own data": push in on the draft and the sources it read.
      const card = $("#mx-c3");

      tl.set("#mx-cursor", { x: 1500, y: 1100 }, 0);

      tl.to("#mx-cursor", { x: 1690, y: 392, duration: 0.95, ease: "power2.inOut" }, 13.6);
