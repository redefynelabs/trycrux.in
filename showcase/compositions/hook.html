  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const words = gsap.utils.toArray("#hook-h1 .w");
      const at = [0.4, 0.88, 0.96, 1.28, 1.68, 1.92, 2.32, 2.72, 3.28];

      // The headline sits in light grey and each word turns to ink as it is spoken.
      // On screen from the first frame (the thumbnail), in grey.
      words.forEach((w, i) => tl.to(w, { color: "#0b0d12", duration: 0.12, ease: "none" }, at[i]));
      // "spending hours managing it": the clock races through the day while admin fills it from the left,
      // and what is left at the end is a sliver of the work itself.
      const PX_PER_MIN = 1600 / 540, END = 520; // the strip is 09:00-18:00; admin runs to 17:40
      const clock = document.querySelector("#hk-clock"), day = { m: 0 };
      const hhmm = (m) => { const t = 540 + Math.round(m / 5) * 5; return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
      tl.fromTo(day, { m: 0 }, { m: END, duration: 1.45, ease: "power1.inOut", onUpdate: () => { clock.textContent = hhmm(day.m); } }, 1.85);
      tl.fromTo("#hk-head", { x: 0 }, { x: END * PX_PER_MIN, duration: 1.45, ease: "power1.inOut" }, 1.85);
      tl.fromTo("#hk-blocks", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 3.7% 0% 0%)", duration: 1.45, ease: "power1.inOut" }, 1.85);
      tl.fromTo("#hk-work", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.25, ease: "expo.out" }, 3.3);
      tl.fromTo("#hk-work-l", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "expo.out" }, 3.34);
      tl.to("#hk-head", { opacity: 0, duration: 0.1 }, 3.3);

      tl.to(words, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", stagger: 0.02 }, 3.62);
      tl.to("#hk-day", { opacity: 0, y: -20, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, 3.64);

      // On "Yet" the tools pile in, each on its word.
      const wins = [
        ["#hk-w1", 3.8, -2], ["#hk-w2", 4.4, 1.5], ["#hk-w6", 4.8, -3], ["#hk-w5", 5.45, 1],
        ["#hk-w3", 6.0, -1], ["#hk-w8", 6.2, 2.5], ["#hk-w4", 6.72, 2], ["#hk-w9", 7.0, -1.5],
        ["#hk-w7", 8.4, -2], ["#hk-w10", 8.96, 3],
      ];
      wins.forEach(([sel, t, r], i) => {
        gsap.set(sel, { zIndex: 10 + i });
        tl.fromTo(sel, { opacity: 0, scale: 0.9, rotation: r * 2, y: 40 }, { opacity: 1, scale: 1, rotation: r, y: 0, duration: 0.42, ease: "expo.out" }, t);
      });

      // Copy and paste: the invoiced cell is copied and carried into the PDF by hand.
      gsap.set("#hk-ghost", { zIndex: 40 });
      // The cell sits at the third column of the first data row (window left + padding + two columns).
      tl.set("#hk-ghost", { x: 120 + 18 + 290, y: 110 + 46 + 14 + 38 }, 0);
      tl.fromTo("#hk-ghost", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" }, 7.2);
      tl.to("#hk-ghost", { x: 1034, y: 596, duration: 0.5, ease: "power2.inOut" }, 7.36);
      tl.to("#hk-ghost", { opacity: 0, duration: 0.1, ease: "power2.in" }, 7.86);
      const paste = document.querySelector("#hk-paste");
      tl.call(() => { paste.textContent = " "; }, null, 0);
      tl.call(() => { paste.textContent = "$12,480.00"; }, null, 7.9);
      tl.fromTo("#hk-paste", { color: "#1f5bf0" }, { color: "#0b0d12", duration: 0.6, ease: "none" }, 7.9);

      // Hectic days: the unread counts climb.
      const climb = (sel, from, to, t0, t1) => {
        const el = document.querySelector(sel), o = { v: from };
        tl.fromTo(o, { v: from }, { v: to, duration: t1 - t0, ease: "power1.in", onUpdate: () => { el.textContent = Math.round(o.v); } }, t0);
      };
      climb("#hk-b2", 48, 63, 8.4, 10.6);
      climb("#hk-b4", 3, 17, 8.6, 10.6);
      climb("#hk-b9", 5, 12, 8.96, 10.6);
      ["#hk-b2", "#hk-b4", "#hk-b9"].forEach((b, i) => tl.fromTo(b, { scale: 1 }, { scale: 1.18, duration: 0.12, yoyo: true, repeat: 3, ease: "power2.out" }, 8.4 + i * 0.25));

      // Everything is pulled to one point at the centre: the next scene makes it the mark.
      wins.forEach(([sel], i) => {
        const el = document.querySelector(sel);
        const cx = 960 - (el.offsetLeft + el.offsetWidth / 2), cy = 540 - (el.offsetTop + el.offsetHeight / 2);
        tl.to(sel, { x: cx, y: cy, scale: 0.03, rotation: 0, filter: "blur(6px)", duration: 0.62, ease: "power3.in" }, 11.02 + (wins.length - i) * 0.025);
        tl.to(sel, { opacity: 0, duration: 0.08 }, 11.62 + (wins.length - i) * 0.025);
      });

      window.__timelines["hook"] = tl;
    })();
