  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const name = document.querySelector("#ec-name");
      const shift = (name.offsetWidth + 36) / 2;
      // "Crux": the mark appears as an outline and fills from the bottom, then the name wipes out of it.
      tl.fromTo("#ec-markbox", { x: shift, opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 0.1);

      tl.fromTo("#ec-name", { clipPath: "inset(0% 100% 0% 0%)", x: shift }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.5, ease: "expo.out" }, 0.72);
      tl.to("#ec-markbox", { x: 0, duration: 0.5, ease: "expo.out" }, 0.72);
      const tag = gsap.utils.toArray("#ec-tag .w");
      [0.9, 1.06, 1.46, 1.86].forEach((t, i) => tl.fromTo(tag[i], { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t));
      // "Try the demo at trycrux.in": the action, held to the end.
      tl.fromTo("#ec-btn", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.5);

      window.__timelines["endcard"] = tl;
